<!--
@Author subuhui
@Date 2026/7/12 19:42
@Description YaClock App 图标的暗色版 SVG 矢量源文件，增强霓虹对比度，适配暗色模式桌面。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- 暗色版更黑的背景，让霓虹色彩更加惊艳 -->
    <linearGradient id="bg-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030208" />
      <stop offset="50%" stop-color="#080712" />
      <stop offset="100%" stop-color="#020308" />
    </linearGradient>
    
    <!-- 增强不透明度的青色霓虹 -->
    <radialGradient id="neon-cyan-dark" cx="35%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </radialGradient>
    
    <!-- 增强不透明度的粉紫霓虹 -->
    <radialGradient id="neon-magenta-dark" cx="65%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#F355DA" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#F355DA" stop-opacity="0" />
    </radialGradient>

    <!-- 中心亮橙微光 -->
    <radialGradient id="neon-orange-dark" cx="50%" cy="520" r="35%">
      <stop offset="0%" stop-color="#FF8A00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF8A00" stop-opacity="0" />
    </radialGradient>
    
    <!-- 玻璃底板填充（在暗色下半透明白稍微降低，呈现更通透的透光感） -->
    <linearGradient id="glass-fill-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
    
    <!-- 玻璃边框高反光渐变 -->
    <linearGradient id="glass-stroke-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#00F2FE" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F355DA" stop-opacity="0.4" />
    </linearGradient>

    <!-- 主指针霓虹青蓝渐变 -->
    <linearGradient id="hand-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    
    <!-- 辅助指针霓虹粉紫渐变 -->
    <linearGradient id="hand-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0844" />
      <stop offset="100%" stop-color="#F355DA" />
    </linearGradient>
    
    <!-- 耳朵与支架渐变 -->
    <linearGradient id="fixture-l" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4FACFE" stop-opacity="0.3" />
    </linearGradient>
    
    <linearGradient id="fixture-r" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F355DA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF0844" stop-opacity="0.3" />
    </linearGradient>

    <!-- 模糊与发光滤镜 -->
    <filter id="blur-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90" />
    </filter>
    
    <filter id="neon-glow-strong" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- 1. 背景 -->
  <rect width="1024" height="1024" fill="url(#bg-grad-dark)" />
  
  <!-- 2. 暗色版更亮丽的背景光晕 -->
  <g filter="url(#blur-heavy)">
    <circle cx="280" cy="280" r="340" fill="url(#neon-cyan-dark)" />
    <circle cx="744" cy="744" r="340" fill="url(#neon-magenta-dark)" />
    <circle cx="512" cy="520" r="280" fill="url(#neon-orange-dark)" />
  </g>
  
  <!-- 3. 闹钟结构与玻璃表盘主体 -->
  <g filter="url(#shadow-dark)">
    <!-- 极简支架 -->
    <line x1="370" y1="740" x2="300" y2="810" stroke="#00F2FE" stroke-width="26" stroke-linecap="round" opacity="0.75" />
    <line x1="654" y1="740" x2="724" y2="810" stroke="#F355DA" stroke-width="26" stroke-linecap="round" opacity="0.75" />
    
    <!-- 极简双耳 -->
    <path d="M 330 390 A 130 130 0 0 1 470 260" fill="none" stroke="url(#fixture-l)" stroke-width="28" stroke-linecap="round" />
    <path d="M 694 390 A 130 130 0 0 0 554 260" fill="none" stroke="url(#fixture-r)" stroke-width="28" stroke-linecap="round" />
    
    <!-- 敲锤 -->
    <rect x="492" y="220" width="40" height="30" rx="10" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.5" />
    <line x1="512" y1="250" x2="512" y2="280" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.5" />
    
    <!-- 玻璃底板 -->
    <circle cx="512" cy="520" r="260" fill="url(#glass-fill-dark)" stroke="url(#glass-stroke-dark)" stroke-width="4.5" />
    
    <!-- 高光反射 -->
    <path d="M 300 440 A 260 260 0 0 1 724 440" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.3" />
  </g>

  <!-- 4. 刻度 -->
  <line x1="512" y1="290" x2="512" y2="308" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.5" />
  <line x1="742" y1="520" x2="724" y2="520" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.5" />
  <line x1="512" y1="750" x2="512" y2="732" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.5" />
  <line x1="282" y1="520" x2="300" y2="520" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.5" />

  <!-- 5. 循环波浪线 -->
  <path d="M 330 570 Q 421 490 512 570 T 694 570" fill="none" stroke="url(#hand-cyan)" stroke-width="7" stroke-linecap="round" opacity="0.5" />

  <!-- 6. 核心“Y”形指针与时钟轴心 (加强霓虹发光) -->
  <g>
    <!-- 分针 (10 点方向) -->
    <line x1="512" y1="520" x2="444.5" y2="403" stroke="url(#hand-cyan)" stroke-width="15" stroke-linecap="round" />
    <circle cx="444.5" cy="403" r="9.5" fill="#00F2FE" filter="url(#neon-glow-strong)" />
    
    <!-- 时针 (2 点方向) -->
    <line x1="512" y1="520" x2="559.5" y2="437.7" stroke="url(#hand-cyan)" stroke-width="19" stroke-linecap="round" />
    <circle cx="559.5" cy="437.7" r="11.5" fill="#00F2FE" filter="url(#neon-glow-strong)" />

    <!-- 垂直指示针 / 秒针 (6 点方向) -->
    <line x1="512" y1="520" x2="512" y2="655" stroke="url(#hand-magenta)" stroke-width="9" stroke-linecap="round" />
    <circle cx="512" cy="655" r="7" fill="#FF0844" filter="url(#neon-glow-strong)" />
    
    <!-- 轴心盖帽 -->
    <circle cx="512" cy="520" r="28" fill="#05030A" stroke="#FFFFFF" stroke-width="4.5" />
    <circle cx="512" cy="520" r="12" fill="#00F2FE" />
  </g>

  <!-- 7. 表盘顶层微弱高光 -->
  <path d="M 350 410 A 260 260 0 0 1 674 410" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.12" />
</svg>
