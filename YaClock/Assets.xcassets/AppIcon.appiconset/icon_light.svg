<!--
@Author subuhui
@Date 2026/7/12 19:54
@Description YaClock App 图标的轻色/标准版 SVG 矢量源文件，高对比度冰川玻璃拟态设计，确保在小尺寸下也极为清晰。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- 浅色轻盈背景：冰蓝色到柔粉色渐变 -->
    <linearGradient id="bg-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F0FC" />
      <stop offset="50%" stop-color="#F2EFFD" />
      <stop offset="100%" stop-color="#F6EBF8" />
    </linearGradient>
    
    <!-- 柔和的背景发光 -->
    <radialGradient id="neon-cyan-light" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="neon-magenta-light" cx="70%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#FC52FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FC52FF" stop-opacity="0" />
    </radialGradient>
    
    <!-- 玻璃填充：高饱和的白，增强盘面实体感 -->
    <linearGradient id="glass-fill-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.35" />
    </linearGradient>
    
    <!-- 玻璃边框高反光渐变 -->
    <linearGradient id="glass-stroke-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#00A8FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FC52FF" stop-opacity="0.6" />
    </linearGradient>

    <!-- 指针使用高对比度实心深宝蓝渐变，确保轮廓极其锐利 -->
    <linearGradient id="hand-cyan-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0635A0" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    
    <!-- 秒针使用深玫瑰红 -->
    <linearGradient id="hand-magenta-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D60042" />
      <stop offset="100%" stop-color="#FF3F78" />
    </linearGradient>
    
    <!-- 耳朵与支架使用高对比度的深蓝紫色金属质感渐变 -->
    <linearGradient id="fixture-l-light" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#093180" />
      <stop offset="100%" stop-color="#0E51D4" />
    </linearGradient>
    
    <linearGradient id="fixture-r-light" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#A6209E" />
      <stop offset="100%" stop-color="#D94BC7" />
    </linearGradient>

    <filter id="blur-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80" />
    </filter>

    <!-- 强化浅色模式下的投影，使白色表盘和耳朵轮廓非常分明 -->
    <filter id="shadow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0B1A3F" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- 1. 浅色轻盈背景 -->
  <rect width="1024" height="1024" fill="url(#bg-grad-light)" />
  
  <!-- 2. 背景氛围发光 -->
  <g filter="url(#blur-heavy)">
    <circle cx="280" cy="280" r="320" fill="url(#neon-cyan-light)" />
    <circle cx="744" cy="744" r="320" fill="url(#neon-magenta-light)" />
  </g>
  
  <!-- 3. 闹钟结构与玻璃表盘主体 (带深度阴影与物理轮廓) -->
  <g filter="url(#shadow-light)">
    <!-- 支架 (全不透明，深色系) -->
    <line x1="370" y1="740" x2="300" y2="810" stroke="#093180" stroke-width="26" stroke-linecap="round" />
    <line x1="654" y1="740" x2="724" y2="810" stroke="#A6209E" stroke-width="26" stroke-linecap="round" />
    
    <!-- 双耳 (高不透明度) -->
    <path d="M 330 390 A 130 130 0 0 1 470 260" fill="none" stroke="url(#fixture-l-light)" stroke-width="28" stroke-linecap="round" />
    <path d="M 694 390 A 130 130 0 0 0 554 260" fill="none" stroke="url(#fixture-r-light)" stroke-width="28" stroke-linecap="round" />
    
    <!-- 敲锤 -->
    <rect x="492" y="220" width="40" height="30" rx="10" fill="none" stroke="#093180" stroke-width="8" />
    <line x1="512" y1="250" x2="512" y2="280" stroke="#093180" stroke-width="8" stroke-linecap="round" />
    
    <!-- 玻璃表盘底板外轮廓暗描边 (为了在浅色背景下产生锐利物理边缘，先画一层暗描边) -->
    <circle cx="512" cy="520" r="260" fill="none" stroke="#0F2459" stroke-width="8" stroke-opacity="0.16" />
    
    <!-- 玻璃表盘底板 (半透明白色填充 + 彩色反光描边) -->
    <circle cx="512" cy="520" r="260" fill="url(#glass-fill-light)" stroke="url(#glass-stroke-light)" stroke-width="4.5" />
    
    <!-- 表盘高光反射 -->
    <path d="M 300 440 A 260 260 0 0 1 724 440" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.65" />
  </g>

  <!-- 4. 刻度 (深灰蓝色以保证极佳的可读性) -->
  <line x1="512" y1="290" x2="512" y2="310" stroke="#0F2459" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  <line x1="742" y1="520" x2="722" y2="520" stroke="#0F2459" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  <line x1="512" y1="750" x2="512" y2="730" stroke="#0F2459" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  <line x1="282" y1="520" x2="302" y2="520" stroke="#0F2459" stroke-width="6" stroke-linecap="round" opacity="0.6" />

  <!-- 5. 循环波浪线 (高对比度深蓝) -->
  <path d="M 330 570 Q 421 490 512 570 T 694 570" fill="none" stroke="#093180" stroke-width="7" stroke-linecap="round" opacity="0.45" />

  <!-- 6. 核心“Y”形指针与时钟轴心 (纯实心指针，无模糊，确保边缘最锋利) -->
  <g>
    <!-- 分针 (10 点方向，深宝蓝) -->
    <line x1="512" y1="520" x2="444.5" y2="403" stroke="url(#hand-cyan-light)" stroke-width="15" stroke-linecap="round" />
    <circle cx="444.5" cy="403" r="9.5" fill="#0635A0" />
    
    <!-- 时针 (2 点方向，深宝蓝) -->
    <line x1="512" y1="520" x2="559.5" y2="437.7" stroke="url(#hand-cyan-light)" stroke-width="19" stroke-linecap="round" />
    <circle cx="559.5" cy="437.7" r="11.5" fill="#0635A0" />

    <!-- 垂直指示针 / 秒针 (6 点方向，深玫红) -->
    <line x1="512" y1="520" x2="512" y2="655" stroke="url(#hand-magenta-light)" stroke-width="9" stroke-linecap="round" />
    <circle cx="512" cy="655" r="7" fill="#D60042" />
    
    <!-- 轴心盖帽 -->
    <circle cx="512" cy="520" r="28" fill="#FFFFFF" stroke="#0635A0" stroke-width="4.5" />
    <circle cx="512" cy="520" r="12" fill="#0635A0" />
  </g>

  <!-- 表盘顶层高光 -->
  <path d="M 350 410 A 260 260 0 0 1 674 410" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.25" />
</svg>
