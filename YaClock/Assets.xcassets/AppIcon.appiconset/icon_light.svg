<!--
@Author subuhui
@Date 2026/7/13 21:32
@Description YaClock App 图标的轻色/标准版 SVG 矢量源文件，纯白背景，双色（深灰蓝 & 珊瑚橘）极简扁平化现代设计。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <!-- 1. 纯白背景 -->
  <rect width="1024" height="1024" fill="#FFFFFF" />
  
  <!-- 2. 闹钟结构与表盘主体 (主色：深灰蓝 #0B1A30) -->
  <g>
    <!-- 极简支架 -->
    <line x1="370" y1="740" x2="300" y2="810" stroke="#0B1A30" stroke-width="26" stroke-linecap="round" />
    <line x1="654" y1="740" x2="724" y2="810" stroke="#0B1A30" stroke-width="26" stroke-linecap="round" />
    
    <!-- 极简双耳 -->
    <path d="M 330 390 A 130 130 0 0 1 470 260" fill="none" stroke="#0B1A30" stroke-width="28" stroke-linecap="round" />
    <path d="M 694 390 A 130 130 0 0 0 554 260" fill="none" stroke="#0B1A30" stroke-width="28" stroke-linecap="round" />
    
    <!-- 敲锤 -->
    <rect x="492" y="220" width="40" height="30" rx="10" fill="none" stroke="#0B1A30" stroke-width="8" />
    <line x1="512" y1="250" x2="512" y2="280" stroke="#0B1A30" stroke-width="8" stroke-linecap="round" />
    
    <!-- 表盘外圆环 -->
    <circle cx="512" cy="520" r="260" fill="none" stroke="#0B1A30" stroke-width="12" />
  </g>

  <!-- 3. 刻度 (深灰蓝) -->
  <line x1="512" y1="290" x2="512" y2="310" stroke="#0B1A30" stroke-width="6" stroke-linecap="round" />
  <line x1="742" y1="520" x2="722" y2="520" stroke="#0B1A30" stroke-width="6" stroke-linecap="round" />
  <line x1="512" y1="750" x2="512" y2="730" stroke="#0B1A30" stroke-width="6" stroke-linecap="round" />
  <line x1="282" y1="520" x2="302" y2="520" stroke="#0B1A30" stroke-width="6" stroke-linecap="round" />

  <!-- 4. 循环波浪线 (深灰蓝) -->
  <path d="M 330 570 Q 421 490 512 570 T 694 570" fill="none" stroke="#0B1A30" stroke-width="8" stroke-linecap="round" />

  <!-- 5. 核心“Y”形指针与时钟轴心 -->
  <g>
    <!-- 分针 (10 点方向，深灰蓝) -->
    <line x1="512" y1="520" x2="444.5" y2="403" stroke="#0B1A30" stroke-width="18" stroke-linecap="round" />
    
    <!-- 时针 (2 点方向，深灰蓝) -->
    <line x1="512" y1="520" x2="559.5" y2="437.7" stroke="#0B1A30" stroke-width="22" stroke-linecap="round" />

    <!-- 垂直秒针 (6 点方向，辅色：珊瑚橘 #FF5A36) -->
    <line x1="512" y1="520" x2="512" y2="655" stroke="#FF5A36" stroke-width="10" stroke-linecap="round" />
    
    <!-- 两个上臂末端小圆点 (辅色：珊瑚橘 #FF5A36) -->
    <circle cx="444.5" cy="403" r="11" fill="#FF5A36" />
    <circle cx="559.5" cy="437.7" r="13" fill="#FF5A36" />
    <!-- 秒针末端小圆点 (辅色：珊瑚橘 #FF5A36) -->
    <circle cx="512" cy="655" r="8" fill="#FF5A36" />
    
    <!-- 轴心盖帽 (外深灰蓝，内珊瑚橘) -->
    <circle cx="512" cy="520" r="30" fill="#FFFFFF" stroke="#0B1A30" stroke-width="6" />
    <circle cx="512" cy="520" r="12" fill="#FF5A36" />
  </g>
</svg>
